[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-gdpnow"
version = "0.1.0"
description = "Euro area GDP nowcast by expenditure component, inspired by the Atlanta Fed GDPNow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["jupyterlab>=4"]

[project.scripts]
eanowcast = "eanowcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eanowcast = ["series.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
